events { worker_connections 1024; }

http {
    upstream user_service { server user-service:3001; }
    upstream product_service { server product-service:3002; }
    upstream order_service { server order-service:3003; }
    upstream payment_service { server payment-service:3004; }
    upstream notification_service { server notification-service:3005; }
    upstream review_service { server review-service:3006; }

    server {
        listen 80;

        location /api/users      { proxy_pass http://user_service; }
        location /api/auth       { proxy_pass http://user_service; }
        location /api/addresses  { proxy_pass http://user_service; }
        location /api/suppliers  { proxy_pass http://user_service; }
        location /api/products   { proxy_pass http://product_service; }
        location /api/categories { proxy_pass http://product_service; }
        location /api/inventory  { proxy_pass http://product_service; }
        location /api/cart       { proxy_pass http://order_service; }
        location /api/orders     { proxy_pass http://order_service; }
        location /api/coupons    { proxy_pass http://order_service; }
        location /api/payments   { proxy_pass http://payment_service; }
        location /api/notifications { proxy_pass http://notification_service; }
        location /api/reviews    { proxy_pass http://review_service; }
    }
}
