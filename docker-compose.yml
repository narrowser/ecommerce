version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ecommerce
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: ecommerce-nginx
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - product-service
      - order-service
      - payment-service
      - notification-service
      - review-service

  user-service:
    build:
      context: .
      dockerfile: ./services/user-service/Dockerfile
    container_name: ecommerce-user-service
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: mysql://root:rootpassword@mysql:3306/ecommerce_user
      JWT_SECRET: dev-secret-change-in-production
      JWT_REFRESH_SECRET: dev-refresh-secret
      PORT: "3001"
    depends_on:
      mysql:
        condition: service_healthy

  product-service:
    build:
      context: .
      dockerfile: ./services/product-service/Dockerfile
    container_name: ecommerce-product-service
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: mysql://root:rootpassword@mysql:3306/ecommerce_product
      JWT_SECRET: dev-secret-change-in-production
      PORT: "3002"
    depends_on:
      mysql:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: ./services/order-service/Dockerfile
    container_name: ecommerce-order-service
    ports:
      - "3003:3003"
    environment:
      DATABASE_URL: mysql://root:rootpassword@mysql:3306/ecommerce_order
      JWT_SECRET: dev-secret-change-in-production
      PORT: "3003"
      PRODUCT_SERVICE_URL: http://product-service:3002
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: ./services/payment-service/Dockerfile
    container_name: ecommerce-payment-service
    ports:
      - "3004:3004"
    environment:
      DATABASE_URL: mysql://root:rootpassword@mysql:3306/ecommerce_payment
      JWT_SECRET: dev-secret-change-in-production
      PORT: "3004"
      ORDER_SERVICE_URL: http://order-service:3003
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: ./services/notification-service/Dockerfile
    container_name: ecommerce-notification-service
    ports:
      - "3005:3005"
    environment:
      DATABASE_URL: mysql://root:rootpassword@mysql:3306/ecommerce_notification
      JWT_SECRET: dev-secret-change-in-production
      PORT: "3005"
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  review-service:
    build:
      context: .
      dockerfile: ./services/review-service/Dockerfile
    container_name: ecommerce-review-service
    ports:
      - "3006:3006"
    environment:
      DATABASE_URL: mysql://root:rootpassword@mysql:3306/ecommerce_review
      JWT_SECRET: dev-secret-change-in-production
      PORT: "3006"
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
